<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LevelUp.AI - Get Started</title>
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <!-- Logo area -->
            <div class="logo-container">
                <svg width="40" height="40" viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M14 24L24 14L34 24L24 34L14 24Z" fill="#E2E8F0"/>
                    <path d="M24 14L34 24V14H24Z" fill="#94A3B8"/>
                    <path d="M14 24L24 34V24H14Z" fill="#94A3B8"/>
                </svg>
            </div>

            <h1 class="title" id="pageTitle">Welcome Back</h1>
            <p class="subtitle" id="pageSubtitle">Sign in to your account</p>

            <div class="social-buttons">
                <button class="btn-social">
                    <i class="fab fa-github"></i> Continue with GitHub
                </button>
                <button class="btn-social">
                    <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google" class="google-icon">
                    Continue with Google
                </button>
            </div>

            <div class="divider">
                <span>or</span>
            </div>

            <form id="authForm">
                <div class="form-group" id="nameGroup" style="display: none;">
                    <label>Name</label>
                    <input type="text" id="loginName" placeholder="Input your name">
                </div>

                <div class="form-group" id="emailGroup">
                    <label>Email</label>
                    <input type="email" id="loginEmail" placeholder="Input your email" required>
                </div>

                <div class="form-group" id="passwordGroup">
                    <label>Password</label>
                    <div class="password-input-wrapper">
                        <input type="password" id="password" placeholder="Input your password" required>
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>
                
                <div class="form-group" id="otpGroup" style="display: none;">
                    <label>Verification Code (Check console for simulated email)</label>
                    <input type="text" id="loginOtp" placeholder="Enter 6-digit OTP" autocomplete="one-time-code">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">Sign In</button>
            </form>

            <div class="switch-auth">
                Don't have an account? <a href="onboarding.html">Sign Up Now</a>
            </div>

            <div class="terms">
                By continuing, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.
            </div>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('password');
            const icon = this.querySelector('i');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
        let loginState = 'step1'; // 'step1' or 'step2'

        document.getElementById('authForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('password').value;
            const otp = document.getElementById('loginOtp').value;
            const btn = document.getElementById('submitBtn');
            const origText = btn.innerHTML;
            
            btn.innerHTML = 'Processing...';
            btn.disabled = true;

            try {
                if (loginState === 'step1') {
                    // Call step 1
                    const baseUrl = window.location.port === '5501' || window.location.protocol === 'file:' ? 'http://localhost:5500' : '';
                    const res = await fetch(baseUrl + '/api/auth/login-step1', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, password })
                    });
                    const data = await res.json();
                    
                    if (!res.ok) {
                        const details = data.details ? "\\nDetails: " + data.details : "";
                        alert("Login failed: " + (data.error || "Unknown error") + details);
                        btn.innerHTML = origText;
                        btn.disabled = false;
                        return;
                    }
                    
                    // Switch to Step 2 (OTP)
                    document.getElementById('passwordGroup').style.display = 'none';
                    document.getElementById('loginEmail').disabled = true;
                    document.getElementById('otpGroup').style.display = 'block';
                    document.getElementById('loginOtp').required = true;
                    document.getElementById('pageTitle').textContent = 'Two-Factor Auth';
                    document.getElementById('pageSubtitle').textContent = 'Enter the code sent to your email';
                    btn.innerHTML = 'Verify Code';
                    loginState = 'step2';
                    
                    btn.disabled = false;
                } else if (loginState === 'step2') {
                    // Call step 2
                    const baseUrl = window.location.port === '5501' || window.location.protocol === 'file:' ? 'http://localhost:5500' : '';
                    const res = await fetch(baseUrl + '/api/auth/login-step2', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ email, otp })
                    });
                    const data = await res.json();
                    
                    if (!res.ok) {
                        alert("Verification failed: " + (data.error || "Unknown error"));
                        btn.innerHTML = 'Verify Code';
                        btn.disabled = false;
                        return;
                    }
                    
                    // Success!
                    localStorage.setItem('supabase_token', data.accessToken);
                    window.location.href = 'index.html';
                }
            } catch (err) {
                console.error(err);
                alert("Network error.");
                btn.innerHTML = origText;
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
